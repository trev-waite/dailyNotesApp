<div
  class="min-h-screen bg-stone-50 dark:bg-stone-950 transition-colors duration-200"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
>
  <div class="max-w-2xl mx-auto px-4 pt-10 pb-6 flex flex-col gap-4 min-h-screen">

    <!-- Header: title + settings -->
    <header class="flex items-center justify-between" data-tauri-drag-region>
      <h1 class="text-base font-semibold text-stone-800 dark:text-stone-100 tracking-tight">
        Daily Notes
      </h1>
      <button
        (click)="showSettings.set(true)"
        class="p-2 rounded-lg text-stone-400 hover:text-stone-700 hover:bg-stone-200 dark:text-stone-500 dark:hover:text-stone-200 dark:hover:bg-stone-800 transition-colors"
        aria-label="Open settings"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
        </svg>
      </button>
    </header>

    <!-- Outgoing Todos -->
    <app-outgoing-todos></app-outgoing-todos>

    <!-- Timeline nav -->
    <div class="bg-white dark:bg-stone-900 rounded-2xl border border-stone-200 dark:border-stone-700" (wheel)="onWheel($event)">
      <app-timeline-nav
        [selectedDate]="currentDate()"
        [noteDates]="allNoteDates()"
        (dateSelected)="onDateSelected($event)"
      ></app-timeline-nav>
    </div>

    <!-- Day editor (fills remaining vertical space) -->
    <app-day-editor
      class="flex flex-col flex-1"
      [date]="currentDate()"
      [content]="currentContent()"
      [saveStatus]="saveStatus()"
      (contentChange)="onContentChange($event)"
    ></app-day-editor>

  </div>
</div>

@if (showSettings()) {
  <app-settings (closed)="showSettings.set(false)"></app-settings>
}
