<div
  class="min-h-screen bg-stone-50 dark:bg-stone-950 transition-colors duration-200"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
>
  <div class="max-w-2xl mx-auto px-4 py-6 flex flex-col gap-4 min-h-screen">

    <!-- Header: title + settings -->
    <header class="flex items-center justify-between">
      <h1 class="text-base font-semibold text-stone-800 dark:text-stone-100 tracking-tight">
        Daily Notes
      </h1>
      <button
        (click)="showSettings.set(true)"
        class="p-2 rounded-lg text-stone-400 hover:text-stone-700 hover:bg-stone-200 dark:text-stone-500 dark:hover:text-stone-200 dark:hover:bg-stone-800 transition-colors"
        aria-label="Open settings"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </button>
    </header>

    <!-- Outgoing Todos -->
    <app-outgoing-todos></app-outgoing-todos>

    <!-- Timeline nav -->
    <div class="bg-white dark:bg-stone-900 rounded-2xl border border-stone-200 dark:border-stone-700">
      <app-timeline-nav
        [selectedDate]="currentDate()"
        [noteDates]="allNoteDates()"
        (dateSelected)="onDateSelected($event)"
      ></app-timeline-nav>
    </div>

    <!-- Day editor (fills remaining vertical space) -->
    <app-day-editor
      class="flex flex-col flex-1"
      [date]="currentDate()"
      [content]="currentContent()"
      [saveStatus]="saveStatus()"
      (contentChange)="onContentChange($event)"
    ></app-day-editor>

  </div>
</div>

@if (showSettings()) {
  <app-settings (closed)="showSettings.set(false)"></app-settings>
}
