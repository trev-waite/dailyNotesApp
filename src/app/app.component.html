<div class="flex h-screen bg-stone-50 dark:bg-stone-950 overflow-hidden transition-colors duration-200">

  <!-- Sidebar -->
  <aside class="flex flex-col w-52 shrink-0 border-r border-stone-200 dark:border-stone-800 bg-white dark:bg-stone-900" data-tauri-drag-region>
    <div class="px-5 py-4 border-b border-stone-200 dark:border-stone-800" data-tauri-drag-region>
      <span class="text-base font-bold text-stone-900 dark:text-stone-100 tracking-tight">Daylog</span>
    </div>

    <nav class="flex-1 px-2 py-3 flex flex-col gap-0.5">
      <button (click)="activeSection.set('today')" class="sidebar-nav-item" [class.active]="activeSection() === 'today'">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
        Today
      </button>
      <button (click)="activeSection.set('timeline')" class="sidebar-nav-item" [class.active]="activeSection() === 'timeline'">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5"/></svg>
        Timeline
      </button>
      <button (click)="activeSection.set('calendar')" class="sidebar-nav-item" [class.active]="activeSection() === 'calendar'">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/></svg>
        Calendar
      </button>
      <button (click)="activeSection.set('search')" class="sidebar-nav-item" [class.active]="activeSection() === 'search'">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 15.803a7.5 7.5 0 0 0 10.607 0z"/></svg>
        Search
      </button>
    </nav>

    <div class="px-2 pb-3 border-t border-stone-200 dark:border-stone-800 pt-2">
      <button (click)="showSettings.set(true)" class="sidebar-nav-item w-full">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
        Settings
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex flex-col flex-1 overflow-hidden">

    <!-- Date header -->
    <div
      class="relative px-6 py-3 shrink-0 text-center group"
      data-tauri-drag-region
    >
      <p class="text-sm font-medium text-stone-500 dark:text-stone-400">{{ formattedDate() }}</p>
      @if ((todosRef?.totalCount() ?? 0) > 0) {
        <div class="w-20 h-1 rounded-full bg-stone-200 dark:bg-stone-700 overflow-hidden mx-auto mt-2.5">
          <div
            class="h-full rounded-full bg-stone-500 dark:bg-stone-400 transition-all duration-300"
            [style.width.%]="((todosRef?.checkedCount() ?? 0) / (todosRef?.totalCount() ?? 1)) * 100"
          ></div>
        </div>
      }
      @if (currentDate() !== todayStr()) {
        <button
          (click)="currentDate.set(todayStr())"
          class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer opacity-0 group-hover:opacity-100 transition-opacity duration-150 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-stone-800 text-white dark:bg-stone-200 dark:text-stone-900 shadow-sm"
        >Today</button>
      }
    </div>

    <!-- Todos panel (resizable) -->
    <div class="overflow-y-auto shrink-0" [style.height.px]="todosPanelHeight()">
      <app-outgoing-todos
        [currentDate]="currentDate()"
        (todoAdded)="onTodoAdded()"
      ></app-outgoing-todos>
    </div>

    <!-- Drag handle -->
    <div
      class="resize-handle-thin shrink-0"
      (mousedown)="startResize($event)"
    ></div>

    <!-- Day editor (fills remaining space, arrows floated inside) -->
    <div class="relative flex-1 overflow-hidden flex flex-col">
      <button
        (click)="navigateDay(-1)"
        class="nav-arrow left-2"
        aria-label="Previous day"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
      </button>
      <button
        (click)="navigateDay(1)"
        class="nav-arrow right-2"
        aria-label="Next day"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
      </button>

      <app-day-editor
        class="flex flex-col flex-1"
        [date]="currentDate()"
        [content]="currentContent()"
        [saveStatus]="saveStatus()"
        (contentChange)="onContentChange($event)"
      ></app-day-editor>
    </div>

  </main>

</div>

@if (showSettings()) {
  <app-settings (closed)="showSettings.set(false)"></app-settings>
}
