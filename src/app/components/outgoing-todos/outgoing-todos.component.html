<div class="bg-white dark:bg-stone-900 rounded-2xl border border-stone-200 dark:border-stone-700 overflow-hidden">
  <!-- Header -->
  <button
    (click)="toggleCollapse()"
    class="w-full flex items-center justify-between px-5 py-4 text-left"
  >
    <span class="text-sm font-semibold text-stone-800 dark:text-stone-100 tracking-wide">
      Outgoing Todos
    </span>
    <div class="flex items-center gap-2">
      @if (totalCount() > 0) {
        <span class="text-xs font-medium text-stone-500 dark:text-stone-400 bg-stone-100 dark:bg-stone-800 px-2 py-0.5 rounded-full">
          {{ checkedCount() }} / {{ totalCount() }}
        </span>
      }
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-4 h-4 text-stone-400 transition-transform duration-200"
        [class.rotate-180]="isCollapsed()"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
      </svg>
    </div>
  </button>

  <!-- Todo list -->
  @if (!isCollapsed()) {
    <div class="max-h-52 overflow-y-auto">
      @if (todos().length === 0) {
        <p class="px-5 pb-4 text-sm text-stone-400 dark:text-stone-500">No todos yet.</p>
      } @else {
        <ul class="px-5 pb-3 space-y-2">
          @for (todo of todos(); track todo.date + ':' + todo.lineIndex) {
            <li class="flex items-start gap-3">
              <button
                (click)="toggleTodo(todo)"
                class="mt-0.5 flex-shrink-0 w-4 h-4 rounded border flex items-center justify-center transition-colors"
                [class.border-stone-300]="!todo.checked"
                [class.dark:border-stone-600]="!todo.checked"
                [class.bg-white]="!todo.checked"
                [class.dark:bg-stone-900]="!todo.checked"
                [class.bg-stone-900]="todo.checked"
                [class.dark:bg-stone-100]="todo.checked"
                [class.border-stone-900]="todo.checked"
                [class.dark:border-stone-100]="todo.checked"
                [attr.aria-label]="'Toggle: ' + todo.text"
              >
                @if (todo.checked) {
                  <svg class="w-2.5 h-2.5 text-white dark:text-stone-900" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                  </svg>
                }
              </button>
              <span
                class="text-sm leading-snug"
                [class.text-stone-700]="!todo.checked"
                [class.dark:text-stone-300]="!todo.checked"
                [class.text-stone-400]="todo.checked"
                [class.line-through]="todo.checked"
              >{{ todo.text }}</span>
            </li>
          }
        </ul>
      }
    </div>
  }
</div>
