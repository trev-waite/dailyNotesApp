<div class="h-full flex flex-col">
  <!-- Reusable checkbox + label fragment -->
  <ng-template #checkboxItem let-todo>
    <button
      (click)="toggleTodo(todo)"
      class="mt-0.5 flex-shrink-0 w-4 h-4 rounded border flex items-center justify-center transition-colors"
      [class.border-stone-300]="!todo.checked"
      [class.dark:border-stone-600]="!todo.checked"
      [class.bg-white]="!todo.checked"
      [class.dark:bg-stone-900]="!todo.checked"
      [class.bg-stone-900]="todo.checked"
      [class.dark:bg-stone-100]="todo.checked"
      [class.border-stone-900]="todo.checked"
      [class.dark:border-stone-100]="todo.checked"
      [attr.aria-label]="'Toggle: ' + todo.text"
    >
      @if (todo.checked) {
        <svg class="w-2.5 h-2.5 text-white dark:text-stone-900" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      }
    </button>
    <span
      class="text-sm leading-snug"
      [class.text-stone-700]="!todo.checked"
      [class.dark:text-stone-300]="!todo.checked"
      [class.text-stone-400]="todo.checked"
      [class.line-through]="todo.checked"
    >{{ todo.text }}</span>
  </ng-template>

  <!-- Todo list + inline input -->
  <div class="flex-1 overflow-y-auto">
    @if (todos().length > 0) {
      <ul class="px-5 pt-3 pb-1 space-y-2">
        @for (todo of todos(); track todo.date + ':' + todo.lineIndex) {
          <li>
            <div class="flex items-start gap-3">
              <ng-container *ngTemplateOutlet="checkboxItem; context: {$implicit: todo}"></ng-container>
            </div>
            @if (todo.children?.length) {
              <ul class="ml-7 mt-1 space-y-1">
                @for (child of todo.children!; track child.date + ':' + child.lineIndex) {
                  <li class="flex items-start gap-2">
                    <ng-container *ngTemplateOutlet="checkboxItem; context: {$implicit: child}"></ng-container>
                  </li>
                }
              </ul>
            }
          </li>
        }
      </ul>
    }
    <div class="px-5 py-2 relative">
      @if (currentLineIndented()) {
        <span class="absolute left-5 top-2 text-xs text-stone-400 dark:text-stone-500 pointer-events-none select-none">↳</span>
      }
      <textarea
        rows="1"
        [placeholder]="todos().length === 0 ? 'Add todos… (Tab to indent, click away to save)' : 'Add more todos…'"
        (keydown)="onInputKeydown($event)"
        (keyup)="updateIndentIndicator($any($event.target))"
        (click)="updateIndentIndicator($any($event.target))"
        (blur)="flushTodos($any($event.target))"
        class="w-full text-sm bg-transparent text-stone-700 dark:text-stone-300 placeholder-stone-300 dark:placeholder-stone-600 focus:outline-none resize-none leading-relaxed"
        [class.pl-5]="currentLineIndented()"
      ></textarea>
    </div>
  </div>
</div>
