<div [class]="outerClass()">

  <!-- Month navigation header -->
  <div class="flex items-center justify-between">
    <button
      (click)="prevMonth()"
      aria-label="Previous month"
      class="flex items-center justify-center w-6 h-6 rounded-full text-stone-400 dark:text-stone-600 hover:text-stone-600 dark:hover:text-stone-300 hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors duration-150"
    >
      <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
      </svg>
    </button>

    <div class="flex items-center gap-2">
      <span [class]="monthLabelClass()">{{ viewMonthLabel() }}</span>
      @if (!isViewingTodayMonth()) {
        <button (click)="goToToday()" [class]="todayLinkClass()">Today</button>
      }
    </div>

    <button
      (click)="nextMonth()"
      aria-label="Next month"
      class="flex items-center justify-center w-6 h-6 rounded-full text-stone-400 dark:text-stone-600 hover:text-stone-600 dark:hover:text-stone-300 hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors duration-150"
    >
      <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/>
      </svg>
    </button>
  </div>

  <!-- Day-of-week labels -->
  <div class="grid grid-cols-7 text-center">
    @for (label of DAY_LABELS; track label) {
      <span [class]="labelClass()">{{ label }}</span>
    }
  </div>

  <!-- Calendar grid -->
  <div class="grid grid-cols-7 flex-1 content-start">
    @for (day of calendarDays(); track day.date) {
      <button
        [class]="day.cellClass"
        (click)="selectDate(day.date)"
        [attr.aria-label]="day.date"
        [attr.aria-current]="day.isToday ? 'date' : null"
      >
        <span [class]="cellTextClass()">{{ day.dayNum }}</span>
        @if (day.hasNote || day.hasTodo) {
          <span [class]="day.dotClass"></span>
        }
      </button>
    }
  </div>

</div>
