<div class="flex flex-col h-full">

  <!-- Header -->
  <div class="px-6 pt-6 pb-4 border-b border-stone-200 dark:border-stone-800 shrink-0">
    <h2 class="text-xs font-semibold text-stone-400 dark:text-stone-500 uppercase tracking-wider">History</h2>
  </div>

  <!-- Feed -->
  <div class="flex-1 overflow-y-auto px-6 py-5">

    @if (loading()) {
      <div class="flex flex-col gap-3">
        @for (_ of [1, 2, 3, 4, 5]; track $index) {
          <div class="rounded-xl border border-stone-200 dark:border-stone-800 p-4 animate-pulse">
            <div class="h-3.5 w-2/3 bg-stone-200 dark:bg-stone-700 rounded mb-2"></div>
            <div class="h-2.5 w-full bg-stone-100 dark:bg-stone-800 rounded mb-1.5 mt-3"></div>
            <div class="h-2.5 w-4/5 bg-stone-100 dark:bg-stone-800 rounded"></div>
          </div>
        }
      </div>

    } @else if (entries().length === 0) {
      <div class="flex flex-col items-center justify-center py-20 text-center">
        <div class="w-10 h-10 rounded-full bg-stone-100 dark:bg-stone-800 flex items-center justify-center mb-3">
          <svg class="w-5 h-5 text-stone-400 dark:text-stone-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
          </svg>
        </div>
        <p class="text-sm font-medium text-stone-500 dark:text-stone-400">No notes yet</p>
        <p class="text-xs text-stone-400 dark:text-stone-500 mt-1">Start writing to see your history here</p>
      </div>

    } @else {
      <div class="flex flex-col gap-3">
        @for (entry of entries(); track entry.date) {
          <button
            (click)="select(entry.date)"
            class="w-full text-left rounded-xl border border-stone-200 dark:border-stone-800 bg-white dark:bg-stone-900 hover:border-stone-300 dark:hover:border-stone-700 hover:bg-stone-50 dark:hover:bg-stone-800/60 px-4 py-4 transition-colors duration-150 group"
          >
            <div class="flex items-start justify-between gap-3">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2">
                  <p class="text-sm font-medium text-stone-800 dark:text-stone-100 truncate">{{ formatDate(entry.date) }}</p>
                  @if (isToday(entry.date)) {
                    <span class="inline-block w-1.5 h-1.5 rounded-full bg-green-400 dark:bg-green-500 shrink-0"></span>
                  }
                </div>
                @if (entry.preview) {
                  <p class="text-xs text-stone-400 dark:text-stone-500 mt-2 leading-relaxed line-clamp-3">{{ entry.preview }}</p>
                } @else {
                  <p class="text-xs text-stone-300 dark:text-stone-600 mt-2 italic">No content</p>
                }
              </div>
              <div class="flex flex-col items-end gap-2 shrink-0 pt-0.5">
                @if (entry.hasTodos) {
                  <span class="px-1.5 py-0.5 rounded text-[10px] font-medium bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 leading-tight">todos</span>
                }
                <svg class="w-3.5 h-3.5 text-stone-300 dark:text-stone-600 group-hover:text-stone-400 dark:group-hover:text-stone-500 transition-colors mt-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/>
                </svg>
              </div>
            </div>
          </button>
        }
      </div>
    }

  </div>

</div>
